[package]
name = "plexus-listen"
version = "0.1.0"
edition = "2021"
description = "Audio capture Substrate plugin — recording, metering, and live streaming"
license = "MIT"

[lib]
name = "plexus_listen"
path = "src/lib.rs"

[[bin]]
name = "plexus-listen"
path = "src/bin/dji_mic.rs"

[dependencies]
# Hub framework integration
plexus-core = "0.3.0"
plexus-macros = "0.3.0"

# Audio capture
cpal = "0.15"

# USB device access
rusb = "0.9"

# WAV file writing
hound = "3.5"

# Async
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
futures = "0.3"

# Serialization + schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.1", features = ["derive"] }

# Async trait (required by plexus-macros generated code)
async-trait = "0.1"

# JSON-RPC (required by plexus-macros generated code)
jsonrpsee = { version = "0.26", features = ["server", "macros"] }

# UUID (required by plexus-macros generated Activation impl)
uuid = { version = "1.6", features = ["v4", "v5"] }

# Base64 encoding for raw audio streaming
base64 = "0.22"

# Logging
tracing = "0.1"

# Ring buffer for audio data
ringbuf = "0.4"

# FFT-based resampling (48kHz → 44.1kHz monitoring output)
rubato = "1.0"
audioadapter-buffers = "2.0"

# Standalone server dependencies
plexus-transport = "0.1.0"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = "0.4"
anyhow = "1"

[features]
default = ["app-capture"]
app-capture = ["screencapturekit"]

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1.5", features = ["macos_13_0"], optional = true }

